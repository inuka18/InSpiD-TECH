# Start everything:            docker compose up --build
# With a local MongoDB too:    docker compose --profile localdb up --build
# (MongoDB Atlas is the default; see README.md.)
# Classifier training (separate profile, never part of `up`): see ai-service/training/README.md
name: inspid

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hardhat:
    build: ./contracts
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_blockNumber',params:[]})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      MODELS_DIR: /app/models
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models:ro # trained classifier; /classify reloads when current.json changes
      - ml_cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    env_file: .env
    environment:
      SCENARIO_DIR: /data/scenario
    ports:
      - "5000:5000"
    volumes:
      - ./data/scenario:/data/scenario:ro
    depends_on:
      neo4j:
        condition: service_healthy
      hardhat:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
        required: false # only present with --profile localdb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Optional local database for teammates without Atlas.
  mongo:
    image: mongo:7
    profiles: ["localdb", "test"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- Backend tests and the test API (profile "test"; always use the LOCAL mongo, database inspid_test).
  # Never started by `docker compose up`. `npm test` refuses to run if the database name is "inspid".
  #   tests:      docker compose --profile localdb --profile test run --rm backend-test
  #   seed:       docker compose --profile localdb --profile test run --rm backend-test npm run seed
  #   test API:   docker compose --profile localdb --profile test up -d backend-test-api   (http://localhost:5001)
  backend-test:
    build: ./backend
    profiles: ["test"]
    env_file: .env
    working_dir: /app
    command: ["npm", "test"]
    environment:
      NODE_ENV: test
      MONGODB_URI: mongodb://mongo:27017/
      MONGODB_DB_NAME: inspid_test
      SCENARIO_DIR: /data/scenario
      DOCS_DIR: /docs
    volumes:
      - ./data/scenario:/data/scenario:ro
      - ./docs:/docs # network:evaluate writes docs/network_evaluation.*
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
    depends_on:
      mongo:
        condition: service_healthy

  backend-test-api:
    extends: backend-test
    command: ["node", "src/server.js"]
    ports:
      - "5001:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # ---- Classifier training jobs: NOT started by a normal `docker compose up` (profile "train").
  # Run them with `docker compose run --rm trainer python -m training.<script>`; see ai-service/training/README.md.
  trainer:
    build: ./ai-service
    profiles: ["train"]
    working_dir: /app
    command: ["python", "-m", "training.train"]
    environment:
      DATA_DIR: /data
      DOCS_DIR: /docs
      MODELS_DIR: /app/models
      EMBED_CACHE_DIR: /cache/embeddings
    volumes:
      - ./data:/data:ro
      - ./docs:/docs
      - ./ai-service/models:/app/models
      - ./ai-service/training:/app/training
      - ml_cache:/cache # Hugging Face weights + cached embeddings (fast reruns)

  # Same as trainer, plus a writable data/processed so it can create jira_review_sample.csv.
  review-sample:
    extends: trainer
    command: ["python", "-m", "training.make_review_sample"]
    volumes:
      - ./data/processed:/data/processed:rw

volumes:
  ml_cache:
  neo4j_data:
  mongo_data:
